<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480"
     role="img" aria-labelledby="chart-title chart-description"
     font-family="DejaVu Sans, Arial, sans-serif">
  <title id="chart-title">Star growth for seorooficial/whatsapp-duo</title>
  <desc id="chart-description">Cumulative GitHub stars since the repository was created. Current total: 1.</desc>
  <defs>
    <linearGradient id="backgroundGradient" x1="0" y1="0" x2="1200" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10242E"/>
      <stop offset="0.58" stop-color="#071016"/>
      <stop offset="1" stop-color="#09171D"/>
    </linearGradient>
    <linearGradient id="areaGradient" x1="0" y1="145" x2="0" y2="408">
      <stop stop-color="#2DD4A5" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#2DD4A5" stop-opacity="0.025"/>
    </linearGradient>
    <filter id="lineGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="480" rx="22" fill="url(#backgroundGradient)"/>
  <rect x="1" y="1" width="1198" height="478" rx="21"
        fill="none" stroke="#2DD4A5" stroke-opacity="0.18"/>

      <text x="60" y="58" fill="#2DD4A5" font-size="13" font-weight="800" letter-spacing="4">STAR GROWTH</text>
      <text x="60" y="101" fill="#F5FBFC" font-size="30" font-weight="800">whatsapp-duo</text>
      <text x="60" y="127" fill="#8696A0" font-size="14">seorooficial · cumulative GitHub stars</text>
      <text x="1136" y="83" text-anchor="end" fill="#F5FBFC" font-size="56" font-weight="800"
            font-variant-numeric="tabular-nums">1</text>
      <text x="1136" y="111" text-anchor="end" fill="#8696A0" font-size="13" font-weight="700"
            letter-spacing="2">TOTAL STARS</text>
  <g font-family="Inter, Segoe UI, system-ui, sans-serif">

      <line x1="86" y1="408.5" x2="1128" y2="408.5"
            stroke="#DFFAF2" stroke-opacity="0.10" stroke-width="1" shape-rendering="crispEdges"/>
      <text x="68" y="412.5" text-anchor="end"
            fill="#8696A0" font-size="12" font-variant-numeric="tabular-nums">0</text>
      <line x1="86" y1="145.5" x2="1128" y2="145.5"
            stroke="#DFFAF2" stroke-opacity="0.10" stroke-width="1" shape-rendering="crispEdges"/>
      <text x="68" y="149.5" text-anchor="end"
            fill="#8696A0" font-size="12" font-variant-numeric="tabular-nums">1</text>

      <line x1="607.5" y1="145" x2="607.5" y2="408"
            stroke="#DFFAF2" stroke-opacity="0.055" stroke-width="1" shape-rendering="crispEdges"/>
      <text x="607.5" y="438" text-anchor="start"
            fill="#8696A0" font-size="12">Jul 26, 2026</text>
    <g filter="url(#lineGlow)">
      <path d="M607.0,408.0 L607.0,145.0 L607.0,408.0 L607.0,408.0 Z" fill="url(#areaGradient)"/>
      <path d="M607.0,408.0 L607.0,145.0" fill="none" stroke="#2DD4A5" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
      <circle cx="607.0" cy="145.0"
                  r="6"
                  fill="#DFFAF2" stroke="#071016" stroke-width="2"/>
      <text x="621"
            y="163"
            text-anchor="start"
            fill="#DFFAF2" font-size="14" font-weight="700">
        1 star · Jul 26, 2026
      </text></g>
    <text x="86" y="455" fill="#627A85" font-size="10"
          font-weight="700" letter-spacing="1.5">SOURCE · GITHUB API</text>
    <text x="1128" y="455" text-anchor="end" fill="#627A85"
          font-size="10" font-weight="700" letter-spacing="1.5">
      CUMULATIVE · UTC
    </text>
  </g>
</svg>
